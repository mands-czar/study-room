<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Room — Estudos</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <div class="site">


        <header>

            <h1>Study Room</h1>

            <p>minha biblioteca de estudos</p>

        </header>


        <!-- MENU -->

        <nav class="main-nav">

            <a href="../index.html">início</a>

            <a href="estudos.html">estudos</a>

            <a href="ia.html">minha IA</a>

            <a href="modo-foco.html">modo foco</a>

        </nav>


        <main>


            <!-- APRESENTAÇÃO -->

            <section class="welcome">

                <h2>Meus estudos</h2>

                <p>
                    Organize aqui seus cursos, aulas e materiais.
                </p>

            </section>


            <!-- PESQUISA -->

            <section class="study-search">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Procurar material..."
                >

            </section>


            <!-- ADICIONAR MATERIAL -->

            <section class="add-study">

                <button
                    type="button"
                    id="showFormButton"
                >
                    adicionar material
                </button>

            </section>


            <!-- FORMULÁRIO -->

            <section
                class="study-form"
                id="studyForm"
                style="display: none;"
            >

                <h2>Novo material</h2>


                <input
                    type="text"
                    id="materialName"
                    placeholder="Nome do material"
                >


                <select id="materialCategory">

                    <option value="curso">
                        Curso
                    </option>

                    <option value="aula">
                        Aula
                    </option>

                    <option value="material">
                        Material
                    </option>

                    <option value="questoes">
                        Questões
                    </option>

                    <option value="outros">
                        Outros
                    </option>

                </select>


                <input
                    type="text"
                    id="materialSubject"
                    placeholder="Matéria"
                >


                <input
                    type="url"
                    id="materialLink"
                    placeholder="Link do material"
                >


                <div class="form-buttons">

                    <button
                        type="button"
                        id="saveMaterialButton"
                    >
                        salvar
                    </button>


                    <button
                        type="button"
                        id="cancelFormButton"
                    >
                        cancelar
                    </button>

                </div>

            </section>


            <!-- MATERIAIS ADICIONADOS POR VOCÊ -->

            <section
                class="study-section"
                id="customMaterialsSection"
            >

                <h2>Meus materiais</h2>


                <div id="customMaterials">

                    <!--
                        Os materiais adicionados
                        por você aparecerão aqui.
                    -->

                </div>

            </section>


        </main>


        <footer>

            <p>
                minha pequena biblioteca de estudos
            </p>

        </footer>


    </div>


    <script src="../js/estudos.js"></script>

</body>

</html>
