<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Room — Modo Foco</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .study-timer {
            text-align: center;
            margin: 30px auto;
            padding: 25px;
            max-width: 600px;
        }


        .study-timer h2 {
            margin-bottom: 15px;
        }


        #timer {
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 20px 0;
        }


        .timer-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }


        .timer-buttons button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
        }


        .focus-video {
            width: 100%;
            max-width: 700px;
            margin: 30px auto;
        }


        .focus-video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border-radius: 12px;
        }

    </style>

</head>


<body>

    <div class="site">


        <header>

            <h1>Study Room</h1>

            <p>hora de estudar</p>

        </header>


        <!-- MENU -->

        <nav class="main-nav">

            <a href="../index.html">início</a>

            <a href="estudos.html">estudos</a>

            <a href="ia.html">minha IA</a>

            <a href="modo-foco.html">modo foco</a>

        </nav>


        <main>


            <section class="welcome">

                <h2>Modo Foco</h2>

                <p>
                    Comece o cronômetro e concentre-se nos estudos.
                </p>

            </section>


            <!-- CRONÔMETRO -->

            <section class="study-timer">

                <h2>tempo de estudo</h2>

                <div id="timer">
                    00:00:00
                </div>


                <div class="timer-buttons">

                    <button
                        type="button"
                        id="startButton"
                    >
                        iniciar
                    </button>


                    <button
                        type="button"
                        id="pauseButton"
                    >
                        pausar
                    </button>


                    <button
                        type="button"
                        id="resetButton"
                    >
                        reiniciar
                    </button>

                </div>

            </section>


            <!-- VÍDEO -->

            <section class="focus-video">

                <iframe
                    src="https://www.youtube.com/embed/a7psAnInAcI?rel=0"
                    title="Vídeo de estudo"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </section>


        </main>


        <footer>

            <p>
                foco, calma e bons estudos
            </p>

        </footer>


    </div>


    <!-- CRONÔMETRO -->

    <script>

        let seconds = 0;

        let timerInterval = null;


        const timer =
            document.getElementById("timer");


        const startButton =
            document.getElementById("startButton");


        const pauseButton =
            document.getElementById("pauseButton");


        const resetButton =
            document.getElementById("resetButton");


        function updateTimer() {

            const hours =
                Math.floor(seconds / 3600);


            const minutes =
                Math.floor((seconds % 3600) / 60);


            const secs =
                seconds % 60;


            const formattedHours =
                String(hours).padStart(2, "0");


            const formattedMinutes =
                String(minutes).padStart(2, "0");


            const formattedSeconds =
                String(secs).padStart(2, "0");


            timer.textContent =
                formattedHours +
                ":" +
                formattedMinutes +
                ":" +
                formattedSeconds;

        }


        startButton.addEventListener(
            "click",
            function () {

                if (timerInterval !== null) {
                    return;
                }


                timerInterval =
                    setInterval(
                        function () {

                            seconds++;

                            updateTimer();

                        },
                        1000
                    );

            }
        );


        pauseButton.addEventListener(
            "click",
            function () {

                clearInterval(timerInterval);

                timerInterval = null;

            }
        );


        resetButton.addEventListener(
            "click",
            function () {

                clearInterval(timerInterval);

                timerInterval = null;

                seconds = 0;

                updateTimer();

            }
        );

    </script>


</body>

</html>
