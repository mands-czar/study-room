<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡ Study Room — Modo Foco ♡</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .study-timer {
            text-align: center;
            margin: 30px auto;
            padding: 25px;
            max-width: 600px;
        }

        .study-timer h2 {
            margin-bottom: 15px;
        }

        #timer {
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 20px 0;
        }

        .timer-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .timer-buttons button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .focus-video {
            width: 100%;
            max-width: 700px;
            margin: 30px auto;
        }

        .focus-video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
        }

    </style>

</head>


<body>

    <div class="site">

        <header>

            <h1>♡ Modo Foco ♡</h1>

            <p>hora de estudar 🎧</p>

        </header>


        <nav>

            <a href="../index.html">🏠 início</a>

            <a href="estudos.html">📚 estudos</a>

            <a href="ia.html">🤖 minha IA</a>

            <a href="modo-foco.html">🌙 modo foco</a>

        </nav>


        <main>


            <section class="welcome">

                <h2>🌙 Modo Foco</h2>

                <p>
                    coloque seu vídeo e comece a estudar ♡
                </p>

            </section>


            <!-- CRONÔMETRO -->

            <section class="study-timer">

                <h2>♡ tempo de estudo ♡</h2>

                <div id="timer">00:00:00</div>

                <div class="timer-buttons">

                    <button id="startButton">▶ iniciar</button>

                    <button id="pauseButton">⏸ pausar</button>

                    <button id="resetButton">↻ reiniciar</button>

                </div>

            </section>


            <!-- VÍDEO -->

            <section class="focus-video">

                <iframe
                    src="https://www.youtube.com/embed/a7psAnInAcI?rel=0"
                    title="Vídeo de estudo"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </section>


        </main>


        <footer>

            <p>♡ foco, calma e bons estudos ♡</p>

        </footer>


    </div>


    <!-- JAVASCRIPT DO CRONÔMETRO -->

    <script>

        let seconds = 0;
        let timerInterval = null;

        const timer = document.getElementById("timer");

        const startButton = document.getElementById("startButton");

        const pauseButton = document.getElementById("pauseButton");

        const resetButton = document.getElementById("resetButton");


        function updateTimer() {

            let hours = Math.floor(seconds / 3600);

            let minutes = Math.floor((seconds % 3600) / 60);

            let secs = seconds % 60;


            hours = String(hours).padStart(2, "0");

            minutes = String(minutes).padStart(2, "0");

            secs = String(secs).padStart(2, "0");


            timer.textContent =
                hours + ":" + minutes + ":" + secs;

        }


        startButton.addEventListener("click", function() {

            if (timerInterval !== null) {
                return;
            }


            timerInterval = setInterval(function() {

                seconds++;

                updateTimer();

            }, 1000);

        });


        pauseButton.addEventListener("click", function() {

            clearInterval(timerInterval);

            timerInterval = null;

        });


        resetButton.addEventListener("click", function() {

            clearInterval(timerInterval);

            timerInterval = null;

            seconds = 0;

            updateTimer();

        });


    </script>


</body>

</html>
